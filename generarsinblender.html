<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador Giro LiteDash v4 - VW Polo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #12151b;
      color: #f0f4f8;
      margin: 0;
      padding: 24px;
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; }
    p.desc { margin: 0 0 18px 0; color: #9fb0c3; font-size: 14px; }
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      background: #1b202a;
      border: 1px solid #2b3342;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    input[type="range"] { width: 100px; cursor: pointer; }
    input[type="file"] { color: #cbd5e1; font-size: 13px; }
    select {
      background: #0f1319;
      color: #f0f4f8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }
    #status {
      margin: 0 0 14px 0;
      font-size: 14px;
      color: #93c5fd;
      min-height: 20px;
    }
    .viewport-wrap {
      display: inline-block;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #2b3342;
      background:
        linear-gradient(45deg, #202632 25%, transparent 25%),
        linear-gradient(-45deg, #202632 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #202632 75%),
        linear-gradient(-45deg, transparent 75%, #202632 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #161a22;
    }
    canvas { display: block; background: transparent; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h2>Generador de Giro 360° para LiteDash (v4)</h2>
  <p class="desc">Giro en eje Y con corrección fija de inclinación (eje X / eje Z) para enderezar modelos .glb torcidos.</p>

  <div class="panel">
    <input type="file" id="fileInput" accept=".glb,.gltf" />

    <div class="control-group">
      <label for="dirSelect">Sentido Y:</label>
      <select id="dirSelect">
        <option value="1" selected>Horario (+Y)</option>
        <option value="-1">Antihorario (-Y)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="fixXSlider">Corregir X (°):</label>
      <input type="range" id="fixXSlider" min="-90" max="90" step="1" value="0" />
      <span id="fixXVal">0°</span>
    </div>

    <div class="control-group">
      <label for="fixZSlider">Corregir Z (°):</label>
      <input type="range" id="fixZSlider" min="-90" max="90" step="1" value="0" />
      <span id="fixZVal">0°</span>
    </div>

    <div class="control-group">
      <label for="heightSlider">Altura cámara:</label>
      <input type="range" id="heightSlider" min="0.4" max="1.6" step="0.05" value="0.85" />
      <span id="heightVal">0.85</span>
    </div>

    <div class="control-group">
      <label for="distSlider">Distancia:</label>
      <input type="range" id="distSlider" min="3.0" max="7.5" step="0.1" value="4.6" />
      <span id="distVal">4.6</span>
    </div>

    <button id="resetCamBtn" type="button">Restablecer</button>
    <button id="exportBtn" type="button" disabled>Generar y descargar 24 WebP + auto.json</button>
  </div>

  <p id="status">Selecciona tu archivo polo.glb y usa Corregir X / Z si el coche viene inclinado.</p>

  <div class="viewport-wrap">
    <canvas id="c" width="640" height="360"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const FRAMES = 24;
    const WIDTH = 640;
    const HEIGHT = 360;

    const canvas = document.getElementById('c');
    const statusEl = document.getElementById('status');
    const exportBtn = document.getElementById('exportBtn');
    const resetCamBtn = document.getElementById('resetCamBtn');
    const dirSelect = document.getElementById('dirSelect');

    const fixXSlider = document.getElementById('fixXSlider');
    const fixZSlider = document.getElementById('fixZSlider');
    const heightSlider = document.getElementById('heightSlider');
    const distSlider = document.getElementById('distSlider');

    const fixXVal = document.getElementById('fixXVal');
    const fixZVal = document.getElementById('fixZVal');
    const heightVal = document.getElementById('heightVal');
    const distVal = document.getElementById('distVal');

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      preserveDrawingBuffer: true
    });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, WIDTH / HEIGHT, 0.1, 100);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.AmbientLight(0xffffff, 1.35));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(5.5, 6.0, 5.5);
    scene.add(keyLight);

    const sideFillLight = new THREE.DirectionalLight(0xdbeafe, 1.35);
    sideFillLight.position.set(-6.0, 2.5, 4.0);
    scene.add(sideFillLight);

    const backLight = new THREE.DirectionalLight(0xe2e8f0, 1.1);
    backLight.position.set(0.0, 3.5, -6.5);
    scene.add(backLight);

    let carRoot = null;
    let modelMesh = null;
    let isExporting = false;

    function applyModelTilt() {
      if (!modelMesh) return;
      const rx = THREE.MathUtils.degToRad(parseFloat(fixXSlider.value) || 0);
      const rz = THREE.MathUtils.degToRad(parseFloat(fixZSlider.value) || 0);
      modelMesh.rotation.x = rx;
      modelMesh.rotation.z = rz;
      modelMesh.updateMatrixWorld(true);
    }

    function applyFramingFromSliders() {
      const fx = parseFloat(fixXSlider.value) || 0;
      const fz = parseFloat(fixZSlider.value) || 0;
      const h = parseFloat(heightSlider.value) || 0.85;
      const d = parseFloat(distSlider.value) || 4.6;

      fixXVal.textContent = `${fx}°`;
      fixZVal.textContent = `${fz}°`;
      heightVal.textContent = h.toFixed(2);
      distVal.textContent = d.toFixed(1);

      applyModelTilt();

      const diag = d * 0.7071;
      camera.position.set(diag, h, diag);
      controls.target.set(0, 0.50, 0);
      controls.update();
    }

    applyFramingFromSliders();

    [fixXSlider, fixZSlider, heightSlider, distSlider].forEach((slider) => {
      slider.addEventListener('input', applyFramingFromSliders);
    });

    resetCamBtn.addEventListener('click', () => {
      fixXSlider.value = '0';
      fixZSlider.value = '0';
      heightSlider.value = '0.85';
      distSlider.value = '4.6';
      applyFramingFromSliders();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      statusEl.textContent = 'Cargando modelo 3D...';

      new GLTFLoader().load(
        url,
        (gltf) => {
          if (carRoot) scene.remove(carRoot);

          carRoot = new THREE.Group();
          modelMesh = gltf.scene;

          const box = new THREE.Box3().setFromObject(modelMesh);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z, 0.001);
          const scale = 3.2 / maxDim;

          modelMesh.scale.setScalar(scale);
          modelMesh.position.set(
            -center.x * scale,
            -box.min.y * scale,
            -center.z * scale
          );

          carRoot.add(modelMesh);
          scene.add(carRoot);

          applyFramingFromSliders();
          exportBtn.disabled = false;
          statusEl.textContent = 'Modelo cargado. Ajusta Corregir X / Z si está inclinado y exporta.';
          URL.revokeObjectURL(url);
        },
        undefined,
        (err) => {
          console.error(err);
          statusEl.textContent = 'Error al cargar el archivo .glb/.gltf.';
          URL.revokeObjectURL(url);
        }
      );
    });

    function animate() {
      requestAnimationFrame(animate);
      if (!isExporting) {
        controls.update();
        renderer.render(scene, camera);
      }
    }
    animate();

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      const objectUrl = URL.createObjectURL(blob);
      a.href = objectUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(objectUrl), 2500);
    }

    exportBtn.addEventListener('click', async () => {
      if (!carRoot || isExporting) return;

      isExporting = true;
      exportBtn.disabled = true;
      resetCamBtn.disabled = true;
      dirSelect.disabled = true;

      const originalRotationY = carRoot.rotation.y;
      const originalDamping = controls.enableDamping;
      const dir = parseFloat(dirSelect.value) || 1;
      controls.enableDamping = false;
      applyModelTilt();

      try {
        for (let i = 0; i < FRAMES; i++) {
          carRoot.rotation.set(0, dir * (2 * Math.PI * i) / FRAMES, 0);
          carRoot.updateMatrixWorld(true);
          renderer.render(scene, camera);

          const blob = await new Promise((resolve) =>
            canvas.toBlob((b) => resolve(b), 'image/webp', 0.88)
          );

          if (blob) {
            downloadBlob(blob, `${String(i).padStart(2, '0')}.webp`);
          }

          statusEl.textContent = `Exportando cuadro ${i + 1} de ${FRAMES}...`;
          await new Promise((r) => setTimeout(r, 220));
        }

        const autoJson = JSON.stringify(
          {
            id: 'vw-polo',
            nombre: 'Polo',
            marca: 'Volkswagen',
            anio: 2003,
            anios: '2002–2005',
            autor: 'Local',
            licencia: 'Personal',
            fuente: 'GLB local',
            gris: 0.45,
            giro: FRAMES
          },
          null,
          2
        );

        downloadBlob(new Blob([autoJson], { type: 'application/json' }), 'auto.json');
        statusEl.textContent = 'Listo: coloca 00.webp..23.webp dentro de giro/ y auto.json junto a giro/ en assets/cars/vw-polo/.';
      } finally {
        carRoot.rotation.y = originalRotationY;
        carRoot.updateMatrixWorld(true);
        controls.enableDamping = originalDamping;
        renderer.render(scene, camera);
        isExporting = false;
        exportBtn.disabled = false;
        resetCamBtn.disabled = false;
        dirSelect.disabled = false;
      }
    });
  </script>
</body>
</html>
